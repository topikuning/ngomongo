name: Mirror to second GitHub account

on:
  push:
    branches:
      - "**"
    tags:
      - "**"
  delete:
  workflow_dispatch:

concurrency:
  group: mirror-to-second-account
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest

    steps:
      - name: Validate MIRROR_TOKEN secret
        env:
          MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}
        run: |
          if [ -z "${MIRROR_TOKEN}" ]; then
            echo "::error::Secret MIRROR_TOKEN belum di-set."
            exit 1
          fi

      - name: Install git-filter-repo
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y git-filter-repo

      # Clone --mirror = bare repo, semua refs ikut, tidak ada working tree.
      - name: Clone source as bare mirror
        env:
          SOURCE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --mirror \
            "https://x-access-token:${SOURCE_TOKEN}@github.com/${{ github.repository }}.git" \
            source.git

      # Hilangkan `.github/workflows/` dari SELURUH riwayat. Filter-repo
      # menulis ulang setiap commit; commit-hash di repo mirror akan
      # berbeda dari source. Konsekuensi yang diterima karena PAT
      # MIRROR_TOKEN tidak memiliki scope `workflow` — alternatif Opsi A
      # (tambah scope ke PAT) gagal di environment ini.
      - name: Strip .github/workflows from history
        working-directory: source.git
        run: |
          git filter-repo \
            --path .github/workflows \
            --invert-paths \
            --force

      - name: Push mirror to second account
        env:
          MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}
        working-directory: source.git
        run: |
          git remote add mirror "https://x-access-token:${MIRROR_TOKEN}@github.com/rjmgcode/ngomongo.git"
          # filter-repo otomatis menghapus remote origin, sehingga --mirror aman
          git push --mirror --force mirror
          echo "Mirror ke rjmgcode/ngomongo selesai (workflow files di-strip)."
