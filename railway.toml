# Konfigurasi deploy Railway untuk service backend ngomongo.
# WAHA, PostgreSQL, dan Redis adalah service Railway terpisah dalam project yang sama.
#
# Catatan penting:
# - `preDeployCommand` dijalankan oleh Railway SEBELUM container baru menerima
#   trafik. Migrasi Prisma WAJIB di sini, JANGAN di startCommand — kalau
#   digabung, migrasi akan memakan jendela healthcheck dan deploy gagal.
# - `startCommand` hanya menjalankan server — log "ngomongo siap di ..." harus
#   muncul cepat agar healthcheck `/health` lulus dalam timeout.
# - `healthcheckTimeout` 300 detik memberi buffer aman untuk cold start.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
preDeployCommand = ["npx prisma migrate deploy"]
startCommand = "node dist/server.js"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
healthcheckPath = "/health"
healthcheckTimeout = 300
numReplicas = 1
