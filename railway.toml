# Konfigurasi deploy Railway untuk service backend ngomongo.
# WAHA, PostgreSQL, dan Redis adalah service Railway terpisah dalam project yang sama.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "npx prisma migrate deploy && node dist/server.js"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
healthcheckPath = "/health"
healthcheckTimeout = 30
numReplicas = 1
